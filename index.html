<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto 多幣種專業監控中心 (GMT+8)</title>
  
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23627EEA'/%3E%3Cpath fill='%23FFF' d='M16.5 4v8.9l7.5 3.3zM16.5 4L9 16.2l7.5-3.3zM16.5 22v6L24 17.6zM16.5 28v-6L9 17.6z'/%3E%3C/svg%3E" />

  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0e14;
      color: #d1d4dc;
      overflow: hidden;
      user-select: none;
    }
    header {
      background: #151924;
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232733;
      height: 54px;
      gap: 8px;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    
    .coin-switcher {
      display: flex;
      background: #090c12;
      border: 1px solid #2c3245;
      border-radius: 6px;
      overflow: hidden;
      padding: 2px;
      gap: 2px;
    }
    .coin-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .coin-btn:hover { color: #fff; background: #1e2433; }
    .coin-btn.active[data-coin="ETHUSDT"] { background: #627EEA; color: #fff; box-shadow: 0 0 8px rgba(98, 126, 234, 0.4); }
    .coin-btn.active[data-coin="BTCUSDT"] { background: #F7931A; color: #fff; box-shadow: 0 0 8px rgba(247, 147, 26, 0.4); }
    .coin-btn.active[data-coin="SOLUSDT"] { background: #9945FF; color: #fff; box-shadow: 0 0 8px rgba(153, 69, 255, 0.4); }
    .coin-btn.active[data-coin="DOGEUSDT"] { background: #C2A633; color: #fff; box-shadow: 0 0 8px rgba(194, 166, 51, 0.4); }
    .coin-btn.active[data-coin="XRPUSDT"] { background: #23292F; color: #00e5ff; border: 1px solid #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }

    .status-badge { font-size: 0.72rem; padding: 3px 7px; border-radius: 8px; border: 1px solid #33394d; font-weight: 600; white-space: nowrap; }
    .status-connected { color: #00e676; background: rgba(0, 230, 118, 0.1); border-color: #00e676; }
    .status-connecting { color: #ffab00; background: rgba(255, 171, 0, 0.1); border-color: #ffab00; }
    .status-error { color: #ff5252; background: rgba(255, 82, 82, 0.1); border-color: #ff5252; }
    
    .header-right { display: flex; align-items: center; gap: 8px; }
    .webhook-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #0d1017;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #282f42;
    }
    .webhook-input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.75rem;
      width: 100px;
      outline: none;
    }
    .btn-dc {
      background: #5865F2;
      border: none;
      color: #fff;
      padding: 4px 8px;
      font-size: 0.72rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-dc:hover { background: #4752c4; }
    .btn-dc-test {
      background: #232733;
      border: 1px solid #3b4254;
      color: #cbd5e1;
      padding: 4px 8px;
      font-size: 0.72rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-measure {
      background: #232733;
      border: 1px solid #3b4254;
      color: #cbd5e1;
      padding: 5px 9px;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-measure:hover { background: #2f3647; color: #fff; }
    .btn-measure.active {
      background: #2962ff;
      border-color: #2962ff;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(41, 98, 255, 0.5);
    }

    .switch-group {
      display: flex;
      background: #0d1017;
      border-radius: 6px;
      border: 1px solid #282f42;
      overflow: hidden;
    }
    .btn-toggle-signal {
      background: transparent;
      border: none;
      padding: 5px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-toggle-long.active { background: rgba(38, 166, 154, 0.25); color: #26a69a; border-right: 1px solid #282f42; }
    .btn-toggle-long.inactive { background: transparent; color: #555c6d; border-right: 1px solid #282f42; text-decoration: line-through; }
    .btn-toggle-short.active { background: rgba(239, 83, 80, 0.25); color: #ef5350; }
    .btn-toggle-short.inactive { background: transparent; color: #555c6d; text-decoration: line-through; }

    .timeframe-group {
      display: flex;
      background: #0d1017;
      border-radius: 6px;
      border: 1px solid #282f42;
      overflow: hidden;
      align-items: center;
    }
    .tf-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 5px 9px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tf-btn:hover { color: #fff; background: #1a1e2b; }
    .tf-btn.active { background: #2962ff; color: #ffffff; }

    .tf-select {
      background: #151924;
      border: none;
      border-left: 1px solid #282f42;
      color: #8b949e;
      padding: 5px 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .tf-select:hover { color: #fff; }
    .tf-select.active { background: #2962ff; color: #ffffff; }

    .btn-audio {
      background: #232733;
      border: 1px solid #3b4254;
      color: white;
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-audio.muted { background: #374151; color: #9ca3af; }

    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100vh - 54px);
      position: relative;
    }
    #chart-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #chart-container {
      width: 100%;
      height: 100%;
      background: #0f121a;
    }

    #measure-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #measure-tooltip {
      position: absolute;
      display: none;
      background: rgba(19, 23, 34, 0.94);
      border: 1px solid #2962ff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #fff;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      font-family: monospace;
    }

    aside {
      background: #131722;
      border-left: 1px solid #232733;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .card {
      background: #1a1e2b;
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid #282f42;
    }
    .card-title {
      font-size: 0.85rem;
      color: #787b86;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 0.84rem;
      align-items: center;
    }
    .metric-val { font-weight: 600; color: #fff; }
    .val-bull { color: #26a69a !important; }
    .val-bear { color: #ef5350 !important; }

    .audio-config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 60%;
    }
    .slider-container input[type="range"] {
      width: 100%;
      accent-color: #2962ff;
      cursor: pointer;
    }
    .audio-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 5px;
    }
    .btn-audio-sub {
      background: #232733;
      border: 1px solid #3b4254;
      color: #e2e8f0;
      padding: 5px 7px;
      font-size: 0.72rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
    }
    .btn-audio-sub:hover { background: #2f3647; color: #fff; }
    .btn-test-bull { border-color: rgba(38, 166, 154, 0.5); color: #26a69a; }
    .btn-test-bull:hover { background: rgba(38, 166, 154, 0.2); }
    .btn-test-bear { border-color: rgba(239, 83, 80, 0.5); color: #ef5350; }
    .btn-test-bear:hover { background: rgba(239, 83, 80, 0.2); }
    .file-input-hidden { display: none; }

    .log-box {
      font-family: monospace;
      font-size: 0.76rem;
      background: #0d1017;
      border: 1px solid #222634;
      border-radius: 6px;
      padding: 6px;
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .log-item { padding: 5px 7px; border-radius: 4px; line-height: 1.4; }
    .log-long { background: rgba(38, 166, 154, 0.15); border-left: 3px solid #26a69a; }
    .log-short { background: rgba(239, 83, 80, 0.15); border-left: 3px solid #ef5350; }
  </style>
</head>
<body onclick="initAudio()">
  <header>
    <div class="header-left">
      <div class="coin-switcher">
        <button class="coin-btn active" data-coin="ETHUSDT" onclick="changeSymbol('ETHUSDT')">ETH</button>
        <button class="coin-btn" data-coin="BTCUSDT" onclick="changeSymbol('BTCUSDT')">BTC</button>
        <button class="coin-btn" data-coin="SOLUSDT" onclick="changeSymbol('SOLUSDT')">SOL</button>
        <button class="coin-btn" data-coin="DOGEUSDT" onclick="changeSymbol('DOGEUSDT')">DOGE</button>
        <button class="coin-btn" data-coin="XRPUSDT" onclick="changeSymbol('XRPUSDT')">XRP</button>
      </div>

      <span id="conn-status" class="status-badge status-connecting">連線中...</span>
    </div>
    
    <div class="header-right">
      <button id="btn-measure-tool" class="btn-measure" onclick="toggleMeasureMode()" title="點擊切換測量工具，或在圖表按住 Shift 鍵拖曳">📏 測量</button>

      <div class="switch-group">
        <button id="btn-toggle-long" class="btn-toggle-signal btn-toggle-long active" onclick="toggleSignal('LONG')">做多: 開</button>
        <button id="btn-toggle-short" class="btn-toggle-signal btn-toggle-short active" onclick="toggleSignal('SHORT')">做空: 開</button>
      </div>

      <div class="webhook-group">
        <span style="font-size: 0.75rem;">🤖 DC:</span>
        <input type="password" id="dc-webhook-url" class="webhook-input" placeholder="貼上 Webhook 網址" />
        <button class="btn-dc" onclick="saveDiscordWebhook()">儲存</button>
        <button class="btn-dc-test" onclick="testDiscordWebhook()">測試</button>
      </div>

      <div class="timeframe-group">
        <button class="tf-btn" onclick="changeTimeframe('5m')">5m</button>
        <button class="tf-btn active" onclick="changeTimeframe('15m')">15m</button>
        <button class="tf-btn" onclick="changeTimeframe('30m')">30m</button>
        <button class="tf-btn" onclick="changeTimeframe('1h')">1h</button>
        <button class="tf-btn" onclick="changeTimeframe('4h')">4h</button>
        <button class="tf-btn" onclick="changeTimeframe('1d')">1d</button>
        <select id="custom-tf-select" class="tf-select" onchange="changeTimeframe(this.value)">
          <option value="" disabled selected>自訂週期</option>
          <option value="1m">1m</option>
          <option value="3m">3m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="2h">2h</option>
          <option value="4h">4h</option>
          <option value="6h">6h</option>
          <option value="8h">8h</option>
          <option value="12h">12h</option>
          <option value="1d">1d</option>
          <option value="3d">3d</option>
          <option value="1w">1w</option>
        </select>
      </div>
      <button id="btn-audio" class="btn-audio" onclick="toggleAudio()">🔊 聲音提醒</button>
    </div>
  </header>

  <main>
    <div id="chart-wrapper">
      <div id="chart-container"></div>
      <canvas id="measure-canvas"></canvas>
      <div id="measure-tooltip"></div>
    </div>
    
    <aside>
      <div class="card">
        <div class="card-title">
          <span id="cur-panel-title">戰情儀表板 (ETH/USDT)</span>
          <span id="cur-tf-label" style="color:#00e676;">15M 週期</span>
        </div>
        <div class="metric-row">
          <span>現價:</span>
          <span id="cur-price" class="metric-val">--</span>
        </div>
        <div class="metric-row">
          <span>當前成交量:</span>
          <span id="cur-vol" class="metric-val">--</span>
        </div>
        <div class="metric-row">
          <span>更新模式:</span>
          <span class="metric-val" style="color:#00e676;">每秒即時更新 (1s)</span>
        </div>
        <div class="metric-row">
          <span>訊號開關狀態:</span>
          <span id="cur-switch-status" class="metric-val" style="color:#60a5fa;">多[開] / 空[開]</span>
        </div>
        <div class="metric-row">
          <span>EMA (9 / 21):</span>
          <span id="cur-ema" class="metric-val">-- / --</span>
        </div>
        <div class="metric-row">
          <span>200 EMA 宏觀:</span>
          <span id="cur-ema200" class="metric-val">--</span>
        </div>
        <div class="metric-row">
          <span>RSI (14):</span>
          <span id="cur-rsi" class="metric-val">--</span>
        </div>
        <div class="metric-row">
          <span>ATR (14):</span>
          <span id="cur-atr" class="metric-val">--</span>
        </div>
        <div class="metric-row">
          <span>動能趨勢:</span>
          <span id="cur-trend" class="metric-val">連線中</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>🎵 警報音效設置</span>
          <span id="audio-source-status" style="color: #2962ff; font-size: 0.72rem;">內建通知音</span>
        </div>
        
        <div class="audio-config-row">
          <span>通知音量:</span>
          <div class="slider-container">
            <input type="range" id="volume-slider" min="0" max="100" value="80" oninput="updateVolume(this.value)" />
            <span id="volume-val" style="min-width: 30px; text-align: right; color:#fff;">80%</span>
          </div>
        </div>

        <div class="audio-action-row">
          <button class="btn-audio-sub btn-test-bull" onclick="playAlertSound('BUY', true)">▶ 試聽多單聲</button>
          <button class="btn-audio-sub btn-test-bear" onclick="playAlertSound('SELL', true)">▶ 試聽空單聲</button>
        </div>

        <div class="audio-action-row" style="margin-top: 6px;">
          <input type="file" id="buy-audio-input" class="file-input-hidden" accept="audio/*" onchange="loadCustomAudio(event, 'BUY')" />
          <input type="file" id="sell-audio-input" class="file-input-hidden" accept="audio/*" onchange="loadCustomAudio(event, 'SELL')" />
          <button class="btn-audio-sub" onclick="document.getElementById('buy-audio-input').click()">📁 導入多單音檔</button>
          <button class="btn-audio-sub" onclick="document.getElementById('sell-audio-input').click()">📁 導入空單音檔</button>
        </div>

        <button class="btn-audio-sub" style="width: 100%; margin-top: 8px;" onclick="resetCustomAudios()">🔄 重置為預設音效</button>
      </div>

      <div class="card">
        <div class="card-title">即時信號狀態</div>
        <div class="metric-row">
          <span>最近訊號:</span>
          <span id="last-sig-type" class="metric-val">無</span>
        </div>
        <div class="metric-row">
          <span>觸發參考價:</span>
          <span id="last-sig-price" class="metric-val">--</span>
        </div>
        <div class="metric-row">
          <span>建議防守 (SL):</span>
          <span id="last-sig-sl" class="metric-val">--</span>
        </div>
      </div>

      <div class="card" style="flex: 1; display: flex; flex-direction: column;">
        <div class="card-title">訊號推播紀錄 (GMT+8)</div>
        <div id="log-list" class="log-box" style="flex:1;">
          <div style="color: #666; text-align: center; padding: 10px;">尚未偵測到即時信號</div>
        </div>
      </div>
    </aside>
  </main>

  <script>
    let currentSymbol = localStorage.getItem('crypto_selected_symbol') || 'ETHUSDT';
    let currentInterval = '15m';

    const COIN_NAMES = {
      'ETHUSDT': 'ETH',
      'BTCUSDT': 'BTC',
      'SOLUSDT': 'SOL',
      'DOGEUSDT': 'DOGE',
      'XRPUSDT': 'XRP'
    };

    function getPriceConfig(symbol) {
      if (symbol.startsWith('DOGE') || symbol.startsWith('XRP')) {
        return { precision: 5, minMove: 0.00001 };
      }
      if (symbol.startsWith('BTC')) {
        return { precision: 1, minMove: 0.1 };
      }
      return { precision: 2, minMove: 0.01 };
    }

    function updateCoinUI() {
      document.querySelectorAll('.coin-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-coin') === currentSymbol);
      });

      const name = COIN_NAMES[currentSymbol] || 'ETH';
      document.getElementById('cur-panel-title').innerText = `戰情儀表板 (${name}/USDT)`;
      document.title = `${name}/USDT 專業監控中心 (GMT+8)`;
    }

    function applyDynamicPrecision(symbol) {
      const cfg = getPriceConfig(symbol);
      const priceFormat = {
        type: 'price',
        precision: cfg.precision,
        minMove: cfg.minMove
      };

      candleSeries.applyOptions({ priceFormat });
      fastEmaLine.applyOptions({ priceFormat });
      slowEmaLine.applyOptions({ priceFormat });
      macroEmaLine.applyOptions({ priceFormat });
    }

    function changeSymbol(newSymbol) {
      if (!newSymbol || currentSymbol === newSymbol) return;
      currentSymbol = newSymbol;
      localStorage.setItem('crypto_selected_symbol', currentSymbol);

      applyDynamicPrecision(currentSymbol);
      updateCoinUI();
      isInitialBoot = true;
      clearMeasurement();
      stopTimer();
      fetchHistoricalData();
    }

    let enableLongSignal = localStorage.getItem('eth_enable_long') !== 'false';
    let enableShortSignal = localStorage.getItem('eth_enable_short') !== 'false';

    function updateSignalSwitchUI() {
      const btnLong = document.getElementById('btn-toggle-long');
      const btnShort = document.getElementById('btn-toggle-short');
      const statusText = document.getElementById('cur-switch-status');

      if (btnLong) {
        btnLong.innerText = enableLongSignal ? "做多: 開" : "做多: 關";
        btnLong.className = "btn-toggle-signal btn-toggle-long " + (enableLongSignal ? "active" : "inactive");
      }
      if (btnShort) {
        btnShort.innerText = enableShortSignal ? "做空: 開" : "做空: 關";
        btnShort.className = "btn-toggle-signal btn-toggle-short " + (enableShortSignal ? "active" : "inactive");
      }
      if (statusText) {
        statusText.innerText = `多[${enableLongSignal ? '開' : '關'}] / 空[${enableShortSignal ? '開' : '關'}]`;
        statusText.style.color = (enableLongSignal && enableShortSignal) ? '#60a5fa' : enableLongSignal ? '#26a69a' : enableShortSignal ? '#ef5350' : '#888';
      }
    }

    function toggleSignal(direction) {
      if (direction === 'LONG') {
        enableLongSignal = !enableLongSignal;
        localStorage.setItem('eth_enable_long', enableLongSignal);
      } else if (direction === 'SHORT') {
        enableShortSignal = !enableShortSignal;
        localStorage.setItem('eth_enable_short', enableShortSignal);
      }
      updateSignalSwitchUI();
      runAnalysisAndRender();
    }

    function formatGMT8Full(timestampSec) {
      const date = new Date(timestampSec * 1000);
      const y = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric' });
      const m = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit' });
      const d = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', day: '2-digit' });
      const time = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit' });
      return `${y}-${m}-${d} ${time}`;
    }

    let discordWebhookUrl = localStorage.getItem('eth_discord_webhook') || '';
    const dcInput = document.getElementById('dc-webhook-url');
    if (discordWebhookUrl) dcInput.value = discordWebhookUrl;

    function saveDiscordWebhook() {
      const url = dcInput.value.trim();
      if (url.startsWith('https://discord.com/api/webhooks/')) {
        localStorage.setItem('eth_discord_webhook', url);
        discordWebhookUrl = url;
        alert('✅ Discord Webhook 儲存成功！');
      } else if (url === '') {
        localStorage.removeItem('eth_discord_webhook');
        discordWebhookUrl = '';
        alert('ℹ️ 已清除 Webhook 設定。');
      } else {

          osc.frequency.setValueAtTime(784, now);

          gain.gain.setValueAtTime(alertVolume * 0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(261.63, now + 0.22);
          gain.gain.setValueAtTime(alertVolume * 0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);

        osc.onended = () => {

        };
      }
    }

    function drawMeasurement() {
      measureCtx.clearRect(0, 0, measureCanvas.width, measureCanvas.height);
      if (!measureStart || !measureCurrent) return;

      const p1 = measureStart;
      const p2 = measureCurrent;

      const x1 = Math.min(p1.x, p2.x);
      const y1 = Math.min(p1.y, p2.y);
      const width = Math.abs(p2.x - p1.x);
      const height = Math.abs(p2.y - p1.y);

      const priceDiff = (p2.price !== null && p1.price !== null) ? (p2.price - p1.price) : 0;
      const pctChange = (p1.price && p1.price > 0) ? ((priceDiff / p1.price) * 100) : 0;
      const isPositive = priceDiff >= 0;

      const fillColor = isPositive ? 'rgba(38, 166, 154, 0.18)' : 'rgba(239, 83, 80, 0.18)';
      const strokeColor = isPositive ? '#26a69a' : '#ef5350';

      measureCtx.fillStyle = fillColor;
      measureCtx.fillRect(x1, y1, width, height);

      measureCtx.strokeStyle = strokeColor;
      measureCtx.lineWidth = 1.5;
      measureCtx.setLineDash([4, 4]);
      measureCtx.strokeRect(x1, y1, width, height);

      measureCtx.beginPath();
      measureCtx.moveTo(p1.x, p1.y);
      measureCtx.lineTo(p2.x, p2.y);
      measureCtx.stroke();
      measureCtx.setLineDash([]);

      let barCount = 1;
      let timeDiffStr = "--";
      if (p1.time && p2.time && rawCandles.length > 0) {
        const tMin = Math.min(p1.time, p2.time);
        const tMax = Math.max(p1.time, p2.time);
        barCount = rawCandles.filter(c => c.time >= tMin && c.time <= tMax).length || 1;
        const totalSec = tMax - tMin;
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400) / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        timeDiffStr = days > 0 ? `${days}天 ${hours}小時` : hours > 0 ? `${hours}小時 ${mins}分` : `${mins}分鐘`;
      }

      const dec = getPriceConfig(currentSymbol).precision;
      const sign = isPositive ? '+' : '';
      measureTooltip.innerHTML = `
        <div style="font-size: 0.92rem; font-weight: 700; color: ${strokeColor}; margin-bottom: 2px;">
          ${sign}${pctChange.toFixed(2)}% (${sign}${priceDiff.toFixed(dec)} U)
        </div>
        <div style="color: #94a3b8; font-size: 0.76rem;">
          範圍: ${barCount} 根 K 線 | 歷時: ${timeDiffStr}
        </div>
      `;
      measureTooltip.style.borderColor = strokeColor;
      measureTooltip.style.display = 'block';

      let tipX = p2.x + 12;
      let tipY = p2.y - 45;
      if (tipX + 180 > chartWrapper.clientWidth) tipX = p2.x - 190;
      if (tipY < 10) tipY = p2.y + 15;
      measureTooltip.style.left = `${tipX}px`;
      measureTooltip.style.top = `${tipY}px`;
    }

    function calcEMA(data, length) {
      const k = 2 / (length + 1);
      const ema = [];
      let prevEma = data[0].close;
      for (let i = 0; i < data.length; i++) {
        const val = i === 0 ? prevEma : data[i].close * k + prevEma * (1 - k);
        ema.push({ time: data[i].time, value: val });
        prevEma = val;
      }
      return ema;
    }

    function calcATR(data, length = 14) {
      const tr = [];
      for (let i = 0; i < data.length; i++) {
        if (i === 0) {
          tr.push(data[i].high - data[i].low);
        } else {
          const hl = data[i].high - data[i].low;
          const hc = Math.abs(data[i].high - data[i - 1].close);
          const lc = Math.abs(data[i].low - data[i - 1].close);
          tr.push(Math.max(hl, hc, lc));
        }
      }
      let atr = 0;
      for (let i = 0; i < length; i++) atr += tr[i];
      atr /= length;
      const atrs = [atr];
      for (let i = length; i < data.length; i++) {
        atr = (atr * (length - 1) + tr[i]) / length;
        atrs.push(atr);
      }
      return atrs;
    }

    function calcRSI(data, length = 14) {
      let gains = 0, losses = 0;
      for (let i = 1; i <= length; i++) {
        const diff = data[i].close - data[i - 1].close;
        if (diff >= 0) gains += diff;
        else losses -= diff;
      }
      let avgGain = gains / length;
      let avgLoss = losses / length;
      const rsiArr = new Array(length).fill(50);
      let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
      rsiArr.push(100 - (100 / (1 + rs)));

      for (let i = length + 1; i < data.length; i++) {
        const diff = data[i].close - data[i - 1].close;
        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? -diff : 0;
        avgGain = (avgGain * (length - 1) + gain) / length;
        avgLoss = (avgLoss * (length - 1) + loss) / length;
        rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        rsiArr.push(100 - (100 / (1 + rs)));
      }
      return rsiArr;
    }

    function renderSignalToLog(type, price, sl, timestampSec) {

    function runAnalysisAndRender() {
      if (!rawCandles || rawCandles.length < 50) return;

      try {
        const fastEma = calcEMA(rawCandles, 9);
        const slowEma = calcEMA(rawCandles, 21);
        const macroEma = calcEMA(rawCandles, Math.min(200, rawCandles.length - 1));
        const rsi = calcRSI(rawCandles, 14);
        const atr = calcATR(rawCandles, 14);

        fastEmaLine.setData(fastEma);
        slowEmaLine.setData(slowEma);
        macroEmaLine.setData(macroEma);

        const markers = [];
        const detectedSignals = [];
        const len = rawCandles.length;
        let lastLongIdx = -999;
        let lastShortIdx = -999;
        const cooldown = 4;

        for (let i = 25; i < len; i++) {
          const cur = rawCandles[i];
          const curFast = fastEma[i].value;
          const curSlow = slowEma[i].value;
          const prevFast = fastEma[i - 1].value;
          const prevSlow = slowEma[i - 1].value;
          const curRsi = rsi[i];
          const prevRsi = rsi[i - 1];
          const curAtr = atr[i - (len - atr.length)] || (cur.close * 0.015);

          const goldCross = prevFast <= prevSlow && curFast > curSlow && cur.close > curSlow;
          const canLong = (i - lastLongIdx >= cooldown);

          const deathCross = prevFast >= prevSlow && curFast < curSlow;
          const wasOverbought = prevRsi >= 65;
          const rsiCrossDown = prevRsi >= 60 && curRsi < 60;
          const canShort = (i - lastShortIdx >= cooldown);

          let signalType = null;

          if (enableLongSignal && goldCross && canLong) {
            lastLongIdx = i;
            signalType = "BUY";
            markers.push({
              time: cur.time,
              position: 'belowBar',
              color: '#00e676',
              shape: 'arrowUp',
              text: '做多'
            });
          } else if (enableShortSignal && ((wasOverbought && rsiCrossDown) || deathCross) && canShort) {
            lastShortIdx = i;
            signalType = "SELL";
            markers.push({
              time: cur.time,
              position: 'aboveBar',
              color: '#ef5350',
              shape: 'arrowDown',
              text: '做空'
            });
          }

          if (signalType) {
            const sl = signalType === "BUY" ? (cur.close - curAtr * 1.5) : (cur.close + curAtr * 1.5);
            detectedSignals.push({ type: signalType, price: cur.close, sl: sl, time: cur.time, idx: i });
          }
        }

        candleSeries.setMarkers(markers);

        if (isInitialBoot && detectedSignals.length > 0) {
          const recentSubset = detectedSignals.slice(-3);
          const logList = document.getElementById('log-list');
          logList.innerHTML = '';
          for (let sig of recentSubset) {
            renderSignalToLog(sig.type, sig.price, sig.sl, sig.time);
            notifiedSignals.add(`${currentSymbol}_${sig.time}_${sig.type}`);
          }
        }

        if (!isInitialBoot) {
          for (let sig of detectedSignals) {
            if (sig.idx >= len - 2) {
              const sigKey = `${currentSymbol}_${sig.time}_${sig.type}`;
              if (!notifiedSignals.has(sigKey)) {
                notifiedSignals.add(sigKey);
                playAlertSound(sig.type);
                sendDiscordNotification(sig.type, sig.price, sig.sl, currentInterval);
                renderSignalToLog(sig.type, sig.price, sig.sl, sig.time);
              }
            }
          }
        }

        const last = rawCandles[len - 1];
        const dec = getPriceConfig(currentSymbol).precision;
        const curFast = fastEma[len - 1].value;
        const curSlow = slowEma[len - 1].value;
        const curMacro = macroEma[len - 1].value;
        const curRsiVal = rsi[len - 1];
        const curAtrVal = atr[atr.length - 1];

        document.getElementById('cur-ema').innerText = curFast.toFixed(dec) + ' / ' + curSlow.toFixed(dec);
        document.getElementById('cur-ema200').innerText = curMacro.toFixed(dec) + (last.close > curMacro ? ' (看多)' : ' (看空)');
        document.getElementById('cur-ema200').className = 'metric-val ' + (last.close > curMacro ? 'val-bull' : 'val-bear');
        document.getElementById('cur-rsi').innerText = curRsiVal.toFixed(1);
        document.getElementById('cur-atr').innerText = curAtrVal.toFixed(dec);
        
        const trendEl = document.getElementById('cur-trend');
        if (curFast > curSlow) {
          trendEl.innerText = "多頭排列 (金叉中)";
          trendEl.className = "metric-val val-bull";
        } else {
          trendEl.innerText = "空頭排列 (死叉中)";
          trendEl.className = "metric-val val-bear";
        }
      } catch (e) {
        console.error("分析計算錯誤:", e);
      }

      if (isInitialBoot) isInitialBoot = false;
    }

    function changeTimeframe(tf) {
      if (!tf || currentInterval === tf) return;
      currentInterval = tf;
      isInitialBoot = true;
      clearMeasurement();

      let isShortcut = false;
      document.querySelectorAll('.tf-btn').forEach(btn => {
        const match = btn.innerText.toLowerCase() === tf.toLowerCase();
        btn.classList.toggle('active', match);
        if (match) isShortcut = true;
      });

      const selectEl = document.getElementById('custom-tf-select');
      if (selectEl) {
        selectEl.value = tf;
        selectEl.classList.toggle('active', !isShortcut);
      }

      document.getElementById('cur-tf-label').innerText = `${tf.toUpperCase()} 週期`;

      stopTimer();
      fetchHistoricalData();
    }

    // ========== 每秒定時更新模組 ==========
    let updateTimer = null;

    function stopTimer() {
      if (updateTimer) {
        clearInterval(updateTimer);
        updateTimer = null;
      }
    }

    function startSecondSchedule() {
      stopTimer();
      const statusEl = document.getElementById('conn-status');
      if (statusEl) {
        statusEl.innerText = `每秒即時 (1s)`;
        statusEl.className = 'status-badge status-connected';
      }

      // 每 1000 毫秒（1秒）觸發一次更新
      updateTimer = setInterval(() => {
        fetchLatestCandle();
      }, 1000);
    }

    async function fetchHistoricalData() {
      const statusEl = document.getElementById('conn-status');
      const coinName = COIN_NAMES[currentSymbol] || currentSymbol;
      statusEl.innerText = `載入 ${coinName} ${currentInterval}...`;
      statusEl.className = 'status-badge status-connecting';

      const endpoints = [
        `https://fapi.binance.com/fapi/v1/klines?symbol=${currentSymbol}&interval=${currentInterval}&limit=500`,
        `https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${currentInterval}&limit=500`
      ];

      let success = false;
      for (let url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const json = await res.json();
          if (!Array.isArray(json) || json.length === 0) continue;

          rawCandles = json.map(d => ({
            time: Math.floor(d[0] / 1000),
            open: parseFloat(d[1]),
            high: parseFloat(d[2]),
            low: parseFloat(d[3]),
            close: parseFloat(d[4]),
            volume: parseFloat(d[5])
          }));

          candleSeries.setData(rawCandles);

          const volumeData = rawCandles.map(d => ({
            time: d.time,
            value: d.volume || 0,
            color: d.close >= d.open ? 'rgba(38, 166, 154, 0.45)' : 'rgba(239, 83, 80, 0.45)'
          }));
          volumeSeries.setData(volumeData);

          const last = rawCandles[rawCandles.length - 1];
          const dec = getPriceConfig(currentSymbol).precision;
          document.getElementById('cur-price').innerText = last.close.toFixed(dec) + ' U';
          document.getElementById('cur-vol').innerText = last.volume >= 1000 ? (last.volume / 1000).toFixed(2) + 'k' : last.volume.toFixed(1);

          chart.timeScale().fitContent();
          runAnalysisAndRender();
          resizeMeasureCanvas();
          success = true;
          break;
        } catch (e) {
          console.warn('API 線路切換: ' + url, e);
        }
      }

      if (success) {
        startSecondSchedule();
      } else {
        statusEl.innerText = '連線失敗';
        statusEl.className = 'status-badge status-error';
      }
    }

    // 每秒定時獲取最新一筆 K 線並更新
    async function fetchLatestCandle() {
      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${currentInterval}&limit=2`);
        if (!res.ok) return;
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          const latest = data[data.length - 1];
          const candle = {
            time: Math.floor(latest[0] / 1000),
            open: parseFloat(latest[1]),
            high: parseFloat(latest[2]),
            low: parseFloat(latest[3]),
            close: parseFloat(latest[4]),
            volume: parseFloat(latest[5])
          };

          const last = rawCandles[rawCandles.length - 1];
          if (candle.time < last.time) return;

          candleSeries.update(candle);
          volumeSeries.update({
            time: candle.time,
            value: candle.volume,
            color: candle.close >= candle.open ? 'rgba(38, 166, 154, 0.45)' : 'rgba(239, 83, 80, 0.45)'
          });

          const dec = getPriceConfig(currentSymbol).precision;
          document.getElementById('cur-price').innerText = candle.close.toFixed(dec) + ' U';
          document.getElementById('cur-vol').innerText = candle.volume >= 1000 ? (candle.volume / 1000).toFixed(2) + 'k' : candle.volume.toFixed(1);

          if (last.time === candle.time) {
            rawCandles[rawCandles.length - 1] = candle;
          } else {
            rawCandles.push(candle);
          }

          runAnalysisAndRender();
        }
      } catch (err) {
        console.warn("每秒定時更新失敗:", err);
      }
    }

    fetchHistoricalData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH SMC 專業即時戰情監控室</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0c0d10; color: #d1d4dc; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        header { height: 50px; background: #131722; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2a2e39; }
        .logo-group { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #f0b90b; }
        .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #2a2e39; color: #848e9c; }
        .status-badge.online { background: rgba(14, 203, 129, 0.2); color: #0ecb81; }
        .webhook-controls { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .webhook-input { background: #1e222d; border: 1px solid #363c4e; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 11px; width: 240px; outline: none; }
        .webhook-input:focus { border-color: #2962ff; }
        .btn { background: #2962ff; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn:hover { background: #1e4bd8; }
        .btn-test { background: #363c4e; }
        .btn-test:hover { background: #4a5065; }

        main { flex: 1; display: flex; position: relative; }
        #chart-container { flex: 1; height: 100%; position: relative; }
        #hud-container { width: 320px; background: #131722; border-left: 1px solid #2a2e39; display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto; }

        .hud-card { background: #1e222d; border-radius: 6px; padding: 10px 12px; border: 1px solid #2a2e39; }
        .hud-title { font-size: 11px; color: #787b86; margin-bottom: 6px; text-transform: uppercase; font-weight: 600; display: flex; justify-content: space-between; }
        .hud-value-row { display: flex; justify-content: space-between; align-items: baseline; }
        .hud-main-val { font-size: 18px; font-weight: 700; color: #fff; }
        .hud-sub-desc { font-size: 11px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }

        .val-bull { color: #0ecb81; background: rgba(14, 203, 129, 0.15); }
        .val-bear { color: #f6465d; background: rgba(246, 70, 93, 0.15); }
        .val-neutral { color: #f0b90b; background: rgba(240, 185, 11, 0.15); }

        @media (max-width: 860px) {
            main { flex-direction: column; }
            #hud-container { width: 100%; height: 260px; border-left: none; border-top: 1px solid #2a2e39; }
            .webhook-input { width: 140px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <span>⚡ ETHUSDT 策略哨兵 (1H)</span>
            <span id="conn-status" class="status-badge">連接中...</span>
        </div>
        <!-- 這裡就是右上角的 Discord Webhook 控制列 -->
        <div class="webhook-controls">
            <input type="password" id="webhook-url" class="webhook-input" placeholder="貼上 Discord Webhook 網址">
            <button id="save-webhook" class="btn">儲存</button>
            <button id="test-webhook" class="btn btn-test">測試推播</button>
        </div>
    </header>

    <main>
        <div id="chart-container"></div>
        <div id="hud-container">
            <div class="hud-card">
                <div class="hud-title">即時現價 (Binance Futures)</div>
                <div class="hud-value-row">
                    <span id="hud-price" class="hud-main-val">--.--</span>
                    <span id="hud-price-vol" class="hud-sub-desc val-neutral">即時串流</span>
                </div>
            </div>

            <div class="hud-card">
                <div class="hud-title">200 EMA 趨勢過濾</div>
                <div class="hud-value-row">
                    <span id="hud-ema" class="hud-main-val">--.--</span>
                    <span id="hud-ema-status" class="hud-sub-desc">計算中</span>
                </div>
            </div>

            <div class="hud-card">
                <div class="hud-title">ADX 趨勢強度 (門檻 20)</div>
                <div class="hud-value-row">
                    <span id="hud-adx" class="hud-main-val">--.--</span>
                    <span id="hud-adx-status" class="hud-sub-desc">計算中</span>
                </div>
            </div>

            <div class="hud-card">
                <div class="hud-title">SMC 結構狀態</div>
                <div class="hud-value-row">
                    <span id="hud-smc-state" class="hud-main-val" style="font-size: 14px;">掃描中...</span>
                </div>
            </div>

            <div class="hud-card">
                <div class="hud-title">Discord 推播狀態</div>
                <div class="hud-value-row">
                    <span id="hud-discord-status" class="hud-main-val" style="font-size: 13px;">未設定</span>
                    <span id="hud-last-alert-time" class="hud-sub-desc val-neutral">無推播</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const webhookInput = document.getElementById('webhook-url');
        const saveWebhookBtn = document.getElementById('save-webhook');
        const testWebhookBtn = document.getElementById('test-webhook');
        const discordStatusEl = document.getElementById('hud-discord-status');
        const lastAlertTimeEl = document.getElementById('hud-last-alert-time');

        let discordWebhookUrl = localStorage.getItem('eth_discord_webhook') || '';
        if (discordWebhookUrl) {
            webhookInput.value = discordWebhookUrl;
            discordStatusEl.textContent = "已連線監聽";
            discordStatusEl.style.color = "#0ecb81";
        }

        saveWebhookBtn.addEventListener('click', () => {
            const url = webhookInput.value.trim();
            if (url.startsWith('https://discord.com/api/webhooks/')) {
                localStorage.setItem('eth_discord_webhook', url);
                discordWebhookUrl = url;
                discordStatusEl.textContent = "已儲存綁定";
                discordStatusEl.style.color = "#0ecb81";
                alert('Discord Webhook 儲存成功！');
            } else if (url === '') {
                localStorage.removeItem('eth_discord_webhook');
                discordWebhookUrl = '';
                discordStatusEl.textContent = "未設定";
                discordStatusEl.style.color = "#d1d4dc";
                alert('已清除 Webhook 設定。');
            } else {
                alert('請輸入合法的 Discord Webhook 網址！');
            }
        });

        async function sendDiscordAlert(title, description, colorHex = 0x2962ff, fields = []) {
            if (!discordWebhookUrl) return;

            const payload = {
                username: "ETH SMC 策略哨兵",
                embeds: [{
                    title: title,
                    description: description,
                    color: colorHex,
                    fields: fields,
                    timestamp: new Date().toISOString(),
                    footer: { text: "ETHUSDT 1H • SMC 雙重過濾策略" }
                }]
            };

            try {
                const res = await fetch(discordWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const now = new Date();
                    lastAlertTimeEl.textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} 已發送`;
                }
            } catch (err) {
                console.error('Discord 推播失敗:', err);
            }
        }

        testWebhookBtn.addEventListener('click', () => {
            if (!discordWebhookUrl) {
                alert('請先在輸入框貼上 Webhook 網址並點擊儲存！');
                return;
            }
            sendDiscordAlert(
                "🔔 測試訊號：SMC 哨兵連線正常",
                "你的 ETH 即時監控網頁已經成功與 Discord 頻道建立連線！",
                0x0ecb81,
                [{ name: "監控標的", value: "ETHUSDT 永續合約", inline: true }, { name: "圖表週期", value: "1 小時 (1H)", inline: true }]
            );
        });

        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { color: '#0c0d10' }, textColor: '#848e9c' },
            grid: { vertLines: { color: '#1a1e29' }, horzLines: { color: '#1a1e29' } },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
            rightPriceScale: { borderColor: '#2a2e39' }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#0ecb81', downColor: '#f6465d',
            borderUpColor: '#0ecb81', borderDownColor: '#f6465d',
            wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
        });

        const emaSeries = chart.addLineSeries({ color: '#f0b90b', lineWidth: 2, title: '200 EMA' });

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });

        let klines = [];
        let lastNotifiedSignalBar = 0;

        function calcEMA(data, period) {
            const k = 2 / (period + 1);
            let ema = [];
            let sum = 0;
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    sum += data[i].close;
                    ema.push({ time: data[i].time, value: NaN });
                } else if (i === period - 1) {
                    sum += data[i].close;
                    ema.push({ time: data[i].time, value: sum / period });
                } else {
                    const prevEma = ema[i - 1].value;
                    ema.push({ time: data[i].time, value: (data[i].close - prevEma) * k + prevEma });
                }
            }
            return ema;
        }

        function calcADX(data, period = 14) {
            if (data.length < period * 2) return 0;
            let trSum = 0;
            for (let i = data.length - period; i < data.length; i++) {
                trSum += (data[i].high - data[i].low);
            }
            const atr = trSum / period;
            const netMove = Math.abs(data[data.length - 1].close - data[data.length - period].close);
            const adxApprox = (netMove / (atr * period)) * 100;
            return Math.min(60, Math.max(10, adxApprox * 4));
        }

        function evaluateSignalAndNotify(latestBar, prevBar, emaVal, adxVal) {
            const isBullTrend = latestBar.close > emaVal;
            const isTrendStrong = adxVal >= 20;

            let smcEvent = "盤整蓄勢";
            let signalType = null;

            if (latestBar.close > prevBar.high && isBullTrend && isTrendStrong) {
                smcEvent = "多頭實體突破 (BOS)";
                signalType = "BUY";
            } else if (latestBar.close < prevBar.low && !isBullTrend && isTrendStrong) {
                smcEvent = "空頭實體突破 (BOS)";
                signalType = "SELL";
            }

            document.getElementById('hud-smc-state').textContent = smcEvent;

            if (signalType && latestBar.time !== lastNotifiedSignalBar) {
                lastNotifiedSignalBar = latestBar.time;
                const riskDist = Math.abs(latestBar.close - (signalType === "BUY" ? latestBar.low : latestBar.high));
                const tp = signalType === "BUY" ? (latestBar.close + riskDist * 2) : (latestBar.close - riskDist * 2);
                const sl = signalType === "BUY" ? latestBar.low : latestBar.high;

                sendDiscordAlert(
                    `🚨 觸發 SMC ${signalType} 開單訊號 (1:2)`,
                    `ETHUSDT 1H 出現突破，符合 200 EMA 順勢與 ADX 強度門檻！`,
                    signalType === "BUY" ? 0x0ecb81 : 0xf6465d,
                    [
                        { name: "方向", value: signalType === "BUY" ? "🟢 做多 (LONG)" : "🔴 做空 (SHORT)", inline: true },
                        { name: "現價 (進場)", value: `$${latestBar.close.toFixed(2)}`, inline: true },
                        { name: "止盈 (TP 2R)", value: `$${tp.toFixed(2)}`, inline: true },
                        { name: "止損 (SL 1R)", value: `$${sl.toFixed(2)}`, inline: true }
                    ]
                );
            }
        }

        async function initData() {
            try {
                const res = await fetch('https://fapi.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=1h&limit=300');
                const raw = await res.json();
                klines = raw.map(d => ({
                    time: d[0] / 1000,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                candleSeries.setData(klines);
                const emaData = calcEMA(klines, 200);
                emaSeries.setData(emaData.filter(d => !isNaN(d.value)));

                updateHUD(klines[klines.length - 1], emaData[emaData.length - 1].value);
                initWebSocket();
            } catch (err) {
                console.error('數據載入失敗:', err);
            }
        }

        function updateHUD(latest, emaVal) {
            document.getElementById('hud-price').textContent = latest.close.toFixed(2);
            document.getElementById('hud-ema').textContent = emaVal ? emaVal.toFixed(2) : '--.--';

            const emaStatusEl = document.getElementById('hud-ema-status');
            if (emaVal) {
                emaStatusEl.textContent = latest.close > emaVal ? "多頭管轄 (僅做多)" : "空頭管轄 (僅做空)";
                emaStatusEl.className = latest.close > emaVal ? "hud-sub-desc val-bull" : "hud-sub-desc val-bear";
            }

            const adxVal = calcADX(klines, 14);
            const adxStatusEl = document.getElementById('hud-adx-status');
            document.getElementById('hud-adx').textContent = adxVal.toFixed(1);
            adxStatusEl.textContent = adxVal >= 20 ? "趨勢明確 (允許開單)" : "震盪死區 (禁止開單)";
            adxStatusEl.className = adxVal >= 20 ? "hud-sub-desc val-bull" : "hud-sub-desc val-bear";

            if (klines.length > 2 && emaVal) {
                evaluateSignalAndNotify(latest, klines[klines.length - 2], emaVal, adxVal);
            }
        }

        function initWebSocket() {
            const ws = new WebSocket('wss://fstream.binance.com/ws/ethusdt@kline_1h');
            const statusBadge = document.getElementById('conn-status');

            ws.onopen = () => {
                statusBadge.textContent = "● 實時串流中";
                statusBadge.classList.add('online');
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.e === 'kline') {
                    const k = msg.k;
                    const bar = {
                        time: k.t / 1000,
                        open: parseFloat(k.o),
                        high: parseFloat(k.h),
                        low: parseFloat(k.l),
                        close: parseFloat(k.c)
                    };

                    candleSeries.update(bar);
                    if (klines[klines.length - 1].time === bar.time) {
                        klines[klines.length - 1] = bar;
                    } else {
                        klines.push(bar);
                    }

                    const emaData = calcEMA(klines, 200);
                    const latestEma = emaData[emaData.length - 1].value;
                    emaSeries.update({ time: bar.time, value: latestEma });
                    updateHUD(bar, latestEma);
                }
            };

            ws.onclose = () => {
                statusBadge.textContent = "○ 重連中...";
                statusBadge.classList.remove('online');
                setTimeout(initWebSocket, 3000);
            };
        }

        initData();
    </script>
</body>
</html>

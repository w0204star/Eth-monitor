  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0e14;
      color: #d1d4dc;
      overflow: hidden;
      user-select: none;
    }
    header {
      background: #151924;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232733;
      height: 52px;
      gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 24px; height: 24px; vertical-align: middle; }
    .header-title { font-weight: 700; font-size: 1.05rem; color: #f0b90b; white-space: nowrap; }
    .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; border: 1px solid #33394d; font-weight: 600; white-space: nowrap; }
    .status-connected { color: #00e676; background: rgba(0, 230, 118, 0.1); border-color: #00e676; }
    .status-connecting { color: #ffab00; background: rgba(255, 171, 0, 0.1); border-color: #ffab00; }
    .status-error { color: #ff5252; background: rgba(255, 82, 82, 0.1); border-color: #ff5252; }
    
    .header-right { display: flex; align-items: center; gap: 8px; }
    .webhook-group {
      display: flex;
      align-items: center;
      gap: 6px;

      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #282f42;
    }

      background: transparent;

      color: #fff;

      width: 130px;
      outline: none;
    }
    .btn-dc {
      background: #5865F2;
      border: none;
      color: #fff;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-dc:hover { background: #4752c4; }
    .btn-dc-test {
      background: #232733;
      border: 1px solid #3b4254;
      color: #cbd5e1;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    /* 測量工具按鈕 */
    .btn-measure {
      background: #232733;
      border: 1px solid #3b4254;
      color: #cbd5e1;
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-measure:hover { background: #2f3647; color: #fff; }
    .btn-measure.active {
      background: #2962ff;
      border-color: #2962ff;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(41, 98, 255, 0.5);
    }

    /* 多空開關按鈕群組 */
    .switch-group {
      display: flex;
      background: #0d1017;
      border-radius: 6px;
      border: 1px solid #282f42;
      overflow: hidden;
    }
    .btn-toggle-signal {
      background: transparent;
      border: none;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-toggle-long.active { background: rgba(38, 166, 154, 0.25); color: #26a69a; border-right: 1px solid #282f42; }

    .btn-toggle-short.active { background: rgba(239, 83, 80, 0.25); color: #ef5350; }

    .timeframe-group {
      display: flex;
      background: #0d1017;
      border-radius: 6px;
      border: 1px solid #282f42;
      overflow: hidden;
      align-items: center;
    }
    .tf-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tf-btn:hover { color: #fff; background: #1a1e2b; }
    .tf-btn.active { background: #2962ff; color: #ffffff; }

    .tf-select {
      background: #151924;
      border: none;
      border-left: 1px solid #282f42;
      color: #8b949e;
      padding: 6px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .tf-select:hover { color: #fff; }
    .tf-select.active { background: #2962ff; color: #ffffff; }

    .btn-audio {
      background: #232733;
      border: 1px solid #3b4254;
      color: white;
      padding: 6px 11px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-audio.muted { background: #374151; color: #9ca3af; }

    main {
      display: grid;
      grid-template-columns: 1fr 350px;
      height: calc(100vh - 52px);
      position: relative;
    }
    #chart-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #chart-container {
      width: 100%;
      height: 100%;

    /* 測量層 Canvas 與 Tooltip 資訊方塊 */

      top: 0;

      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;

    .card {
      background: #1a1e2b;

      padding: 12px 14px;
      border: 1px solid #282f42;
    }
    .card-title {
      font-size: 0.85rem;
      color: #787b86;
      text-transform: uppercase;
      margin-bottom: 8px;

    .metric-row {

      justify-content: space-between;

      font-size: 0.85rem;
      align-items: center;
    }
    .metric-val { font-weight: 600; color: #fff; }
    .val-bull { color: #26a69a !important; }
    .val-bear { color: #ef5350 !important; }

    /* 音效設定面板樣式 */
    .audio-config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.82rem;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 60%;
    }
    .slider-container input[type="range"] {
      width: 100%;
      accent-color: #2962ff;
      cursor: pointer;
    }
    .audio-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-audio-sub {
      background: #232733;

      color: #e2e8f0;
      padding: 5px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
    }
    .btn-audio-sub:hover { background: #2f3647; color: #fff; }
    .btn-test-bull { border-color: rgba(38, 166, 154, 0.5); color: #26a69a; }
    .btn-test-bull:hover { background: rgba(38, 166, 154, 0.2); }
    .btn-test-bear { border-color: rgba(239, 83, 80, 0.5); color: #ef5350; }
    .btn-test-bear:hover { background: rgba(239, 83, 80, 0.2); }
    .file-input-hidden { display: none; }

    .log-box {
      font-family: monospace;
      font-size: 0.78rem;
      background: #0d1017;
      border: 1px solid #222634;
      border-radius: 6px;
      padding: 8px;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-item { padding: 6px 8px; border-radius: 4px; line-height: 1.4; }
    .log-long { background: rgba(38, 166, 154, 0.15); border-left: 3px solid #26a69a; }
    .log-short { background: rgba(239, 83, 80, 0.15); border-left: 3px solid #ef5350; }
  </style>
</head>

          <input type="file" id="buy-audio-input" class="file-input-hidden" accept="audio/*" onchange="loadCustomAudio(event, 'BUY')" />
          <input type="file" id="sell-audio-input" class="file-input-hidden" accept="audio/*" onchange="loadCustomAudio(event, 'SELL')" />
          <button class="btn-audio-sub" onclick="document.getElementById('buy-audio-input').click()">📁 導入多單音檔</button>
          <button class="btn-audio-sub" onclick="document.getElementById('sell-audio-input').click()">📁 導入空單音檔</button>

  <script>
    // ========== 0. 多空訊號開關控制 ==========
    let enableLongSignal = localStorage.getItem('eth_enable_long') !== 'false';
    let enableShortSignal = localStorage.getItem('eth_enable_short') !== 'false';

    function updateSignalSwitchUI() {
      const btnLong = document.getElementById('btn-toggle-long');
      const btnShort = document.getElementById('btn-toggle-short');
      const statusText = document.getElementById('cur-switch-status');

      if (btnLong) {
        btnLong.innerText = enableLongSignal ? "做多: 開" : "做多: 關";
        btnLong.className = "btn-toggle-signal btn-toggle-long " + (enableLongSignal ? "active" : "inactive");
      }
      if (btnShort) {
        btnShort.innerText = enableShortSignal ? "做空: 開" : "做空: 關";
        btnShort.className = "btn-toggle-signal btn-toggle-short " + (enableShortSignal ? "active" : "inactive");
      }
      if (statusText) {
        statusText.innerText = `多[${enableLongSignal ? '開' : '關'}] / 空[${enableShortSignal ? '開' : '關'}]`;
        statusText.style.color = (enableLongSignal && enableShortSignal) ? '#60a5fa' : enableLongSignal ? '#26a69a' : enableShortSignal ? '#ef5350' : '#888';
      }
    }

    function toggleSignal(direction) {
      if (direction === 'LONG') {
        enableLongSignal = !enableLongSignal;
        localStorage.setItem('eth_enable_long', enableLongSignal);
      } else if (direction === 'SHORT') {
        enableShortSignal = !enableShortSignal;
        localStorage.setItem('eth_enable_short', enableShortSignal);
      }
      updateSignalSwitchUI();
      runAnalysisAndRender();
    }

    // ========== GMT+8 時間輔助函數 ==========
    function formatGMT8Time(timestampSec) {
      const date = new Date(timestampSec * 1000);
      return date.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatGMT8Full(timestampSec) {
      const date = new Date(timestampSec * 1000);
      const y = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric' });
      const m = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit' });
      const d = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', day: '2-digit' });
      const time = date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit' });
      return `${y}-${m}-${d} ${time}`;
    }

    // ========== 1. Discord Webhook 模組 ==========
    let discordWebhookUrl = localStorage.getItem('eth_discord_webhook') || '';
    const dcInput = document.getElementById('dc-webhook-url');
    if (discordWebhookUrl) dcInput.value = discordWebhookUrl;

    function saveDiscordWebhook() {
      const url = dcInput.value.trim();
      if (url.startsWith('https://discord.com/api/webhooks/')) {
        localStorage.setItem('eth_discord_webhook', url);
        discordWebhookUrl = url;
        alert('✅ Discord Webhook 儲存成功！');
      } else if (url === '') {
        localStorage.removeItem('eth_discord_webhook');
        discordWebhookUrl = '';
        alert('ℹ️ 已清除 Webhook 設定。');
      } else {
        alert('❌ 請輸入正確的 Discord Webhook 網址！');
      }
    }

    async function sendDiscordNotification(type, price, sl, tf) {
      if (!discordWebhookUrl) return;
      const isBuy = type === "BUY";
      const gmt8Time = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
      const payload = {
        username: "ETH 策略哨兵 (GMT+8)",
        content: "@everyone",
        embeds: [{
          title: isBuy ? "🚀 【做多信號觸發】ETHUSDT" : "🩸 【做空信號觸發】ETHUSDT",
          color: isBuy ? 0x26a69a : 0xef5350,
          fields: [
            { name: "監控週期", value: tf, inline: true },
            { name: "觸發現價", value: `$${price.toFixed(2)}`, inline: true },
            { name: "建議防守止損", value: `$${sl.toFixed(2)}`, inline: true },
            { name: "觸發時間 (GMT+8)", value: gmt8Time, inline: false }
          ],
          timestamp: new Date().toISOString(),
          footer: { text: "ETH 獨立戰情中心推播" }
        }]
      };
      try {
        await fetch(discordWebhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Discord 推播失敗:', e);
      }
    }

    function testDiscordWebhook() {
      if (!discordWebhookUrl) {

    // ========== 2. 純音效通知系統 ==========
    let audioCtx = null;
    let audioEnabled = true;
    let alertVolume = parseFloat(localStorage.getItem('eth_alert_volume') || '0.8');
    let customBuyAudioBase64 = localStorage.getItem('eth_custom_buy_audio') || null;
    let customSellAudioBase64 = localStorage.getItem('eth_custom_sell_audio') || null;

    document.addEventListener('DOMContentLoaded', () => {

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function stopCurrentPlayingSound() {
      if (currentPlayingAudio) {
        try {
          currentPlayingAudio.pause();
          currentPlayingAudio.currentTime = 0;
        } catch (e) {}
        currentPlayingAudio = null;
      }
      if (currentOscillator) {
        try {
          currentOscillator.stop();
          currentOscillator.disconnect();
        } catch (e) {}
        currentOscillator = null;
      }
    }

    function updateVolume(val) {
      alertVolume = parseInt(val, 10) / 100;
      localStorage.setItem('eth_alert_volume', alertVolume.toString());

    function updateAudioStatusText() {
      const statusEl = document.getElementById('audio-source-status');
      if (customBuyAudioBase64 || customSellAudioBase64) {

    function loadCustomAudio(event, type) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        alert('音檔過大（請小於 5MB）！');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        if (type === 'BUY') {
          customBuyAudioBase64 = base64Data;
          localStorage.setItem('eth_custom_buy_audio', base64Data);
          alert('✅ 做多自訂音檔載入成功！');
        } else {
          customSellAudioBase64 = base64Data;
          localStorage.setItem('eth_custom_sell_audio', base64Data);
          alert('✅ 做空自訂音檔載入成功！');
        }
        updateAudioStatusText();
        playAlertSound(type, true);
      };
      reader.readAsDataURL(file);
    }

    function resetCustomAudios() {
      stopCurrentPlayingSound();
      customBuyAudioBase64 = null;

      localStorage.removeItem('eth_custom_buy_audio');
      localStorage.removeItem('eth_custom_sell_audio');
      updateAudioStatusText();

    function toggleAudio() {
      initAudio();

    function playAlertSound(type, isTest = false) {
      if (!audioEnabled && !isTest) return;
      initAudio();

      stopCurrentPlayingSound();

      const customAudioData = (type === "BUY") ? customBuyAudioBase64 : customSellAudioBase64;
      if (customAudioData) {
        const audio = new Audio(customAudioData);
        audio.volume = alertVolume;
        currentPlayingAudio = audio;
        audio.onended = () => {
          if (currentPlayingAudio === audio) currentPlayingAudio = null;
        };
        audio.play().catch(e => console.warn('自訂音訊播放受阻:', e));
      } else {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        currentOscillator = osc;

        if (type === "BUY") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(784, now);
          osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.12);
          gain.gain.setValueAtTime(alertVolume * 0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(261.63, now + 0.22);
          gain.gain.setValueAtTime(alertVolume * 0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        }

        osc.onended = () => {
          if (currentOscillator === osc) currentOscillator = null;
        };
      }
    }

    // ========== 3. 圖表初始化 ==========
    const chartContainer = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { color: '#0f121a' }, textColor: '#8b949e' },
      grid: { vertLines: { color: '#1a1f2c' }, horzLines: { color: '#1a1f2c' } },

          if (tickMarkType === 1) return date.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', month: 'short' });
          if (tickMarkType === 2) return date.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', day: 'numeric' });
          return date.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit' });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',

    const fastEmaLine = chart.addLineSeries({ color: '#00e5ff', lineWidth: 2, title: 'EMA 9' });
    const slowEmaLine = chart.addLineSeries({ color: '#ff9100', lineWidth: 2, title: 'EMA 21' });
    const macroEmaLine = chart.addLineSeries({ color: '#787b86', lineWidth: 2, lineStyle: 2, title: 'EMA 200' });

    const volumeSeries = chart.addHistogramSeries({

    volumeSeries.priceScale().applyOptions({

    // ========== 4. 尺規測量工具 (Measure Tool) ==========
    const measureCanvas = document.getElementById('measure-canvas');
    const measureCtx = measureCanvas.getContext('2d');
    const measureTooltip = document.getElementById('measure-tooltip');
    const chartWrapper = document.getElementById('chart-wrapper');

    let isMeasureActive = false;
    let isMeasuring = false;
    let measureStart = null;
    let measureCurrent = null;
    let isShiftKeyDown = false;

    function resizeMeasureCanvas() {
      const rect = chartWrapper.getBoundingClientRect();
      measureCanvas.width = rect.width;
      measureCanvas.height = rect.height;
      drawMeasurement();
    }

    function toggleMeasureMode() {
      isMeasureActive = !isMeasureActive;
      const btn = document.getElementById('btn-measure-tool');
      if (btn) btn.classList.toggle('active', isMeasureActive);
      if (!isMeasureActive) {
        clearMeasurement();
      }
    }

    function clearMeasurement() {
      isMeasuring = false;
      measureStart = null;
      measureCurrent = null;
      measureCtx.clearRect(0, 0, measureCanvas.width, measureCanvas.height);
      measureTooltip.style.display = 'none';
      chart.applyOptions({ handleScroll: true, handleScale: true });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Shift') isShiftKeyDown = true;
      if (e.key === 'Escape') {
        clearMeasurement();
        if (isMeasureActive) toggleMeasureMode();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Shift') isShiftKeyDown = false;
    });

    function getMouseLogicalPos(e) {
      const rect = chartWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const time = chart.timeScale().coordinateToTime(x);
      const price = candleSeries.coordinateToPrice(y);
      return { x, y, time, price };
    }

    chartWrapper.addEventListener('mousedown', (e) => {
      if (isMeasureActive || isShiftKeyDown) {
        e.preventDefault();
        const pos = getMouseLogicalPos(e);
        if (pos.price !== null) {
          isMeasuring = true;
          measureStart = pos;
          measureCurrent = pos;
          chart.applyOptions({ handleScroll: false, handleScale: false });
        }
      } else if (measureStart && !isMeasuring) {
        clearMeasurement();
      }
    });

    chartWrapper.addEventListener('mousemove', (e) => {
      if (isMeasuring && measureStart) {
        measureCurrent = getMouseLogicalPos(e);
        drawMeasurement();
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isMeasuring) {
        isMeasuring = false;
        chart.applyOptions({ handleScroll: true, handleScale: true });
        if (isMeasureActive && !isShiftKeyDown) {
          toggleMeasureMode();
        }
      }
    });

    function drawMeasurement() {
      measureCtx.clearRect(0, 0, measureCanvas.width, measureCanvas.height);
      if (!measureStart || !measureCurrent) return;

      const p1 = measureStart;
      const p2 = measureCurrent;

      const x1 = Math.min(p1.x, p2.x);
      const y1 = Math.min(p1.y, p2.y);
      const width = Math.abs(p2.x - p1.x);
      const height = Math.abs(p2.y - p1.y);

      const priceDiff = (p2.price !== null && p1.price !== null) ? (p2.price - p1.price) : 0;
      const pctChange = (p1.price && p1.price > 0) ? ((priceDiff / p1.price) * 100) : 0;
      const isPositive = priceDiff >= 0;

      const fillColor = isPositive ? 'rgba(38, 166, 154, 0.18)' : 'rgba(239, 83, 80, 0.18)';
      const strokeColor = isPositive ? '#26a69a' : '#ef5350';

      measureCtx.fillStyle = fillColor;
      measureCtx.fillRect(x1, y1, width, height);

      measureCtx.strokeStyle = strokeColor;
      measureCtx.lineWidth = 1.5;
      measureCtx.setLineDash([4, 4]);
      measureCtx.strokeRect(x1, y1, width, height);

      measureCtx.beginPath();
      measureCtx.moveTo(p1.x, p1.y);
      measureCtx.lineTo(p2.x, p2.y);
      measureCtx.stroke();
      measureCtx.setLineDash([]);

      let barCount = 1;
      let timeDiffStr = "--";
      if (p1.time && p2.time && rawCandles.length > 0) {
        const tMin = Math.min(p1.time, p2.time);
        const tMax = Math.max(p1.time, p2.time);
        barCount = rawCandles.filter(c => c.time >= tMin && c.time <= tMax).length || 1;
        const totalSec = tMax - tMin;
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400) / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        timeDiffStr = days > 0 ? `${days}天 ${hours}小時` : hours > 0 ? `${hours}小時 ${mins}分` : `${mins}分鐘`;
      }

      const sign = isPositive ? '+' : '';
      measureTooltip.innerHTML = `
        <div style="font-size: 0.92rem; font-weight: 700; color: ${strokeColor}; margin-bottom: 2px;">
          ${sign}${pctChange.toFixed(2)}% (${sign}${priceDiff.toFixed(2)} U)
        </div>
        <div style="color: #94a3b8; font-size: 0.76rem;">
          範圍: ${barCount} 根 K 線 | 歷時: ${timeDiffStr}
        </div>
      `;
      measureTooltip.style.borderColor = strokeColor;
      measureTooltip.style.display = 'block';

      let tipX = p2.x + 12;
      let tipY = p2.y - 45;
      if (tipX + 180 > chartWrapper.clientWidth) tipX = p2.x - 190;
      if (tipY < 10) tipY = p2.y + 15;
      measureTooltip.style.left = `${tipX}px`;
      measureTooltip.style.top = `${tipY}px`;
    }

    window.addEventListener('resize', () => {
      chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
      resizeMeasureCanvas();
    });
    setTimeout(resizeMeasureCanvas, 500);

    // ========== 5. 指標算法 ==========
    function calcEMA(data, length) {
      const k = 2 / (length + 1);
      const ema = [];
      let prevEma = data[0].close;
      for (let i = 0; i < data.length; i++) {
        const val = i === 0 ? prevEma : data[i].close * k + prevEma * (1 - k);
        ema.push({ time: data[i].time, value: val });
        prevEma = val;
      }
      return ema;
    }

    function calcATR(data, length = 14) {
      const tr = [];
      for (let i = 0; i < data.length; i++) {
        if (i === 0) {
          tr.push(data[i].high - data[i].low);
        } else {
          const hl = data[i].high - data[i].low;
          const hc = Math.abs(data[i].high - data[i - 1].close);
          const lc = Math.abs(data[i].low - data[i - 1].close);
          tr.push(Math.max(hl, hc, lc));
        }
      }
      let atr = 0;
      for (let i = 0; i < length; i++) atr += tr[i];
      atr /= length;
      const atrs = [atr];
      for (let i = length; i < data.length; i++) {
        atr = (atr * (length - 1) + tr[i]) / length;
        atrs.push(atr);
      }
      return atrs;
    }

    function calcRSI(data, length = 14) {
      let gains = 0, losses = 0;
      for (let i = 1; i <= length; i++) {
        const diff = data[i].close - data[i - 1].close;
        if (diff >= 0) gains += diff;
        else losses -= diff;
      }
      let avgGain = gains / length;
      let avgLoss = losses / length;
      const rsiArr = new Array(length).fill(50);
      let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
      rsiArr.push(100 - (100 / (1 + rs)));

      for (let i = length + 1; i < data.length; i++) {
        const diff = data[i].close - data[i - 1].close;
        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? -diff : 0;
        avgGain = (avgGain * (length - 1) + gain) / length;
        avgLoss = (avgLoss * (length - 1) + loss) / length;
        rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        rsiArr.push(100 - (100 / (1 + rs)));
      }
      return rsiArr;
    }

    // ========== 6. 訊號推播與節流分析渲染 ==========
    let rawCandles = [];
    let notifiedSignals = new Set();
    let isInitialBoot = true;
    let analysisTimer = null;

    function renderSignalToLog(type, price, sl, timestampSec) {
      document.getElementById('last-sig-type').innerText = type === "BUY" ? "▲ 做多進場" : "▼ 做空進場";
      document.getElementById('last-sig-type').className = "metric-val " + (type === "BUY" ? "val-bull" : "val-bear");
      document.getElementById('last-sig-price').innerText = price.toFixed(2) + " USDT";
      document.getElementById('last-sig-sl').innerText = sl.toFixed(2) + " USDT";

      const logList = document.getElementById('log-list');
      const timeStr = timestampSec ? formatGMT8Full(timestampSec) : formatGMT8Full(Math.floor(Date.now() / 1000));
      const div = document.createElement('div');
      div.className = "log-item " + (type === "BUY" ? "log-long" : "log-short");
      div.innerHTML = `<strong>[${timeStr}] (${currentInterval}) ${type === "BUY" ? '🚀 做多' : '🩸 做空'}</strong><br/>進場: ${price.toFixed(2)} | 止損: ${sl.toFixed(2)}`;
      
      if (logList.children[0] && (logList.children[0].innerText.includes('中...') || logList.children[0].innerText.includes('尚未'))) {
        logList.innerHTML = '';
      }
      logList.insertBefore(div, logList.firstChild);
    }

    // 節流分析排程：避免在每秒數十次 Tick 時阻塞渲染
    function scheduleAnalysis() {
      if (analysisTimer) return;
      analysisTimer = setTimeout(() => {
        analysisTimer = null;
        runAnalysisAndRender();
      }, 150);
    }

    function runAnalysisAndRender() {
      if (rawCandles.length < 50) return;

      const fastEma = calcEMA(rawCandles, 9);
      const slowEma = calcEMA(rawCandles, 21);
      const macroEma = calcEMA(rawCandles, Math.min(200, rawCandles.length - 1));
      const rsi = calcRSI(rawCandles, 14);
      const atr = calcATR(rawCandles, 14);

      fastEmaLine.setData(fastEma);
      slowEmaLine.setData(slowEma);
      macroEmaLine.setData(macroEma);

      const markers = [];
      const detectedSignals = [];
      const len = rawCandles.length;
      let lastLongIdx = -999;
      let lastShortIdx = -999;
      const cooldown = 4;

      for (let i = 25; i < len; i++) {
        const cur = rawCandles[i];
        const curFast = fastEma[i].value;
        const curSlow = slowEma[i].value;
        const prevFast = fastEma[i - 1].value;
        const prevSlow = slowEma[i - 1].value;
        const curRsi = rsi[i];
        const prevRsi = rsi[i - 1];
        const curAtr = atr[i - (len - atr.length)] || (cur.close * 0.015);

        const goldCross = prevFast <= prevSlow && curFast > curSlow && cur.close > curSlow;
        const canLong = (i - lastLongIdx >= cooldown);

        const deathCross = prevFast >= prevSlow && curFast < curSlow;
        const wasOverbought = prevRsi >= 65;
        const rsiCrossDown = prevRsi >= 60 && curRsi < 60;
        const canShort = (i - lastShortIdx >= cooldown);

        let signalType = null;

        if (enableLongSignal && goldCross && canLong) {
          lastLongIdx = i;
          signalType = "BUY";
          markers.push({
            time: cur.time,
            position: 'belowBar',
            color: '#00e676',
            shape: 'arrowUp',
            text: '做多'
          });
        } else if (enableShortSignal && ((wasOverbought && rsiCrossDown) || deathCross) && canShort) {
          lastShortIdx = i;
          signalType = "SELL";
          markers.push({
            time: cur.time,
            position: 'aboveBar',
            color: '#ef5350',
            shape: 'arrowDown',
            text: '做空'
          });
        }

        if (signalType) {
          const sl = signalType === "BUY" ? (cur.close - curAtr * 1.5) : (cur.close + curAtr * 1.5);
          detectedSignals.push({ type: signalType, price: cur.close, sl: sl, time: cur.time, idx: i });
        }
      }

      candleSeries.setMarkers(markers);

      if (isInitialBoot && detectedSignals.length > 0) {
        const recentSubset = detectedSignals.slice(-3);
        const logList = document.getElementById('log-list');
        logList.innerHTML = '';
        for (let sig of recentSubset) {
          renderSignalToLog(sig.type, sig.price, sig.sl, sig.time);
          notifiedSignals.add(`${sig.time}_${sig.type}`);
        }
      }

      if (!isInitialBoot) {
        for (let sig of detectedSignals) {
          if (sig.idx >= len - 2) {
            const sigKey = `${sig.time}_${sig.type}`;
            if (!notifiedSignals.has(sigKey)) {
              notifiedSignals.add(sigKey);
              playAlertSound(sig.type);
              sendDiscordNotification(sig.type, sig.price, sig.sl, currentInterval);
              renderSignalToLog(sig.type, sig.price, sig.sl, sig.time);
            }
          }
        }
      }

      const last = rawCandles[len - 1];
      const curFast = fastEma[len - 1].value;
      const curSlow = slowEma[len - 1].value;
      const curMacro = macroEma[len - 1].value;
      const curRsiVal = rsi[len - 1];
      const curAtrVal = atr[atr.length - 1];

      document.getElementById('cur-ema').innerText = curFast.toFixed(1) + ' / ' + curSlow.toFixed(1);
      document.getElementById('cur-ema200').innerText = curMacro.toFixed(1) + (last.close > curMacro ? ' (看多)' : ' (看空)');
      document.getElementById('cur-ema200').className = 'metric-val ' + (last.close > curMacro ? 'val-bull' : 'val-bear');
      document.getElementById('cur-rsi').innerText = curRsiVal.toFixed(1);
      document.getElementById('cur-atr').innerText = curAtrVal.toFixed(2);
      
      const trendEl = document.getElementById('cur-trend');
      if (curFast > curSlow) {
        trendEl.innerText = "多頭排列 (金叉中)";
        trendEl.className = "metric-val val-bull";
      } else {
        trendEl.innerText = "空頭排列 (死叉中)";
        trendEl.className = "metric-val val-bear";
      }

      if (isInitialBoot) isInitialBoot = false;
    }

    // ========== 7. 週期切換與行情載入 ==========
    let activeWs = null;

    function changeTimeframe(tf) {
      if (!tf || currentInterval === tf) return;
      currentInterval = tf;
      isInitialBoot = true;
      clearMeasurement();

      let isShortcut = false;
      document.querySelectorAll('.tf-btn').forEach(btn => {
        const match = btn.innerText.toLowerCase() === tf.toLowerCase();
        btn.classList.toggle('active', match);
        if (match) isShortcut = true;
      });

      const selectEl = document.getElementById('custom-tf-select');
      if (selectEl) {
        selectEl.value = tf;
        selectEl.classList.toggle('active', !isShortcut);
      }

      document.getElementById('cur-tf-label').innerText = `${tf.toUpperCase()} 週期`;

      if (activeWs) {
        activeWs.onclose = null;
        activeWs.close();
        activeWs = null;
      }

      fetchHistoricalData();
    }

    async function fetchHistoricalData() {
      const statusEl = document.getElementById('conn-status');
      statusEl.innerText = `讀取 ${currentInterval} 中...`;
      statusEl.className = 'status-badge status-connecting';

      const endpoints = [
        `https://fapi.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=${currentInterval}&limit=1000`,
        `https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=${currentInterval}&limit=1000`
      ];

      let success = false;
      for (let url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const json = await res.json();
          if (!Array.isArray(json) || json.length === 0) continue;

          rawCandles = json.map(d => ({
            time: Math.floor(d[0] / 1000),
            open: parseFloat(d[1]),
            high: parseFloat(d[2]),
            low: parseFloat(d[3]),
            close: parseFloat(d[4]),
            volume: parseFloat(d[5])
          }));

          candleSeries.setData(rawCandles);

          const volumeData = rawCandles.map(d => ({
            time: d.time,
            value: d.volume || 0,
            color: d.close >= d.open ? 'rgba(38, 166, 154, 0.45)' : 'rgba(239, 83, 80, 0.45)'
          }));
          volumeSeries.setData(volumeData);

          chart.timeScale().fitContent();
          runAnalysisAndRender();
          resizeMeasureCanvas();
          success = true;
          break;
        } catch (e) {
          console.warn('載入失敗，切換線路: ' + url, e);
        }
      }

      if (success) {
        statusEl.innerText = `即時連線 (${currentInterval})`;
        statusEl.className = 'status-badge status-connected';
        initWebSocket();
      } else {
        statusEl.innerText = '連線失敗';
        statusEl.className = 'status-badge status-error';
      }
    }

    // ========== 8. 零延遲 WebSocket 即時跳動監聽 ==========
    function initWebSocket() {
      // 優先使用合約即時頻道，若斷線自動切換
      const wsUrls = [
        `wss://fstream.binance.com/ws/ethusdt@kline_${currentInterval}`,
        `wss://stream.binance.com:9443/ws/ethusdt@kline_${currentInterval}`
      ];
      
      let urlIdx = 0;
      function connect() {
        activeWs = new WebSocket(wsUrls[urlIdx]);
        const statusEl = document.getElementById('conn-status');

        activeWs.onopen = () => {
          statusEl.innerText = `即時連線 (${currentInterval})`;
          statusEl.className = 'status-badge status-connected';
        };

        activeWs.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (!msg || !msg.k) return;
          const k = msg.k;

          const candle = {
            time: Math.floor(k.t / 1000),
            open: parseFloat(k.o),
            high: parseFloat(k.h),
            low: parseFloat(k.l),
            close: parseFloat(k.c),
            volume: parseFloat(k.v)
          };

          // 1. 第一毫秒直接繪製最新價與成交量，保證平滑跳動
          candleSeries.update(candle);
          volumeSeries.update({
            time: candle.time,
            value: candle.volume,
            color: candle.close >= candle.open ? 'rgba(38, 166, 154, 0.45)' : 'rgba(239, 83, 80, 0.45)'
          });

          // 2. 即時更新右側即時現價與量能面板
          document.getElementById('cur-price').innerText = candle.close.toFixed(2) + ' U';
          document.getElementById('cur-vol').innerText = candle.volume >= 1000 ? (candle.volume / 1000).toFixed(2) + 'k' : candle.volume.toFixed(1);

          // 3. 維護記憶體數據隊列
          const last = rawCandles[rawCandles.length - 1];
          if (last && last.time === candle.time) {
            rawCandles[rawCandles.length - 1] = candle;
          } else {
            rawCandles.push(candle);
          }

          // 4. 節流調度後續指標運算
          scheduleAnalysis();
        };

        activeWs.onerror = () => {
          statusEl.innerText = '連線重試中...';
          statusEl.className = 'status-badge status-connecting';
        };

        activeWs.onclose = () => {
          if (activeWs) {
            urlIdx = (urlIdx + 1) % wsUrls.length;
            setTimeout(connect, 3000);
          }
        };
      }

      connect();
    }

    fetchHistoricalData();
  </script>
